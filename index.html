<!DOCTYPE html>
<html lang="en">
<head>
<script>/* apply saved theme before first paint (no white flash) */try{if(localStorage.getItem("si-theme")==="dark")document.documentElement.classList.add("theme-dark");}catch(e){}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schedule AI Insight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="assets/schedule-insight.css?v=20261015a">
<link rel="stylesheet" href="assets/trend-modal.css?v=20261014c">
<link rel="stylesheet" href="assets/insights-nui.css?v=20261013f">
<link rel="stylesheet" href="assets/ai-hub.css?v=20261013h">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<link rel="stylesheet" href="assets/eva/chatbot.css?v=20260929t">
<link rel="stylesheet" href="assets/dark-theme.css?v=20261015a">
<link rel="stylesheet" href="assets/typography.css?v=20260929t">
</head>
<body>
<div class="app">

  <!-- ================= LEFT RAIL (matches Schedule_UI.html) ================= -->
  <aside class="rail">
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4M8 14h3M8 17h6"/></svg>
    </div>
    <div class="icons">
      <button class="active" title="Dashboard">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 10v10h14V10"/></svg>
      </button>
      <button title="Schedule">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="17" rx="2"/><path d="M4 9h16M8 2v4M16 2v4M8 13h3M8 17h6"/></svg>
      </button>
      <button title="Time clock">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5.2l3.4 2"/></svg>
      </button>
      <button title="Employees">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3"/><circle cx="4.6" cy="10" r="2"/><circle cx="19.4" cy="10" r="2"/><path d="M6.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5"/></svg>
      </button>
      <button title="Time off">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>
      </button>
      <button title="Requests">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="m3 9 9 5 9-5"/></svg>
      </button>
      <button title="Team">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="3"/><circle cx="17" cy="10" r="2.3"/><path d="M3.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5M16 14.5c2.4.2 4.5 2 4.5 4.5"/></svg>
      </button>
    </div>
    <div class="fab" title="Support">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>
    </div>
  </aside>

  <div class="main">

    <!-- ================= TOP BAR (matches Schedule_UI.html) ================= -->
    <header class="topbar">
      <div class="tb">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        My Apps <i class="caret"></i>
      </div>
      <div class="tb">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
        Schedule
      </div>
      <div class="tb">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 21s7-6.3 7-11a7 7 0 1 0-14 0c0 4.7 7 11 7 11z"/><circle cx="12" cy="10" r="2.4"/></svg>
        007 - Encinitas <i class="caret"></i>
      </div>

      <div class="center">
        <div class="tb" style="gap:6px">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#cfe3f5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4.2 4.2 0 0 1-.4-8.4A5.7 5.7 0 0 1 17.6 10 4 4 0 0 1 17.2 18z"/></svg>
          96 &deg;F
        </div>
        <span class="divider">|</span>
        <div class="clock">
          <span>09:09</span><span class="sup">A</span><span class="tz">AMERICA/LOS ANGELES</span>
        </div>
      </div>

      <div class="right">
        <div class="store-pill">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 9h16v11H4zM3 9l2-4h14l2 4"/><path d="M9 20v-6h6v6"/></svg>
          Original Fish Taco, LLC <i class="caret"></i>
        </div>
        <div class="pm-wrap" id="pmWrap">
          <button class="avatar-top pm-trigger" title="Profile & settings" onclick="event.stopPropagation(); siToggleProfileMenu()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></svg>
          </button>
          <div class="pm-menu" onclick="event.stopPropagation()">
            <div class="pm-head">
              <div class="pm-av"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></svg></div>
              <div><div class="pm-name">Store Manager</div><div class="pm-mail">007 - Encinitas</div></div>
            </div>
            <button class="pm-item"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>My Profile</button>
            <button class="pm-item"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Account Settings</button>
            <div class="pm-sec">
              <div class="pm-sec-h">Appearance</div>
              <div class="pm-seg" role="radiogroup" aria-label="Theme">
                <button data-theme="light" onclick="siSetTheme('light')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Light</button>
                <button data-theme="dark" onclick="siSetTheme('dark')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>Dark</button>
              </div>
            </div>
            <div class="pm-sec">
              <div class="pm-sec-h">Account Settings</div>
              <label class="pm-toggle" title="Show impact and data points on the AI Insights tiles">
                <span class="pm-toggle-tx">Enable New Tiles for Insight</span>
                <button type="button" class="pm-switch" id="si-newtiles-switch" role="switch" aria-checked="false" onclick="siSetNewTiles(!document.body.classList.contains('si-newtiles'))"><i></i></button>
              </label>
            </div>
            <div class="pm-sec">
              <button class="pm-item danger"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>Sign out</button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- ================= SCHEDULE INSIGHT SUB-HEADER ================= -->
    <div class="si-subheader">
      <div class="si-title-wrap">
        <div class="si-title-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11V7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h5"/><path d="M8 3v4M16 3v4M4 10h16"/><path d="M17.5 13.5l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z" fill="#fff"/></svg>
        </div>
        <span class="si-title">Schedule AI Insight</span>
        <span class="si-ai-badge">AI</span>
      </div>
      <a class="si-back" href="schedule-dashboard.html" title="Back to the Schedule dashboard">
        <span class="si-back-ic"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg></span>
        Back to Dashboard
      </a>
      <div class="si-tabs">
        <button class="si-tab active" data-tab="insights" onclick="siSwitchTab('insights')">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.4 10.9c.5.4.9 1 .9 1.6v.5h5v-.5c0-.6.4-1.2.9-1.6A6 6 0 0 0 12 3z"/></svg>
          Insights
        </button>
        <button class="si-tab" data-tab="deepdive" onclick="siSwitchTab('deepdive')">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v16M13 13h6M13 17h6"/></svg>
          Deep Dive
        </button>
      </div>
    </div>

    <!-- ================= TAB PANELS ================= -->
    <div class="si-body">
      <div class="si-panel active" id="tab-insights"></div>
      <div class="si-panel" id="tab-deepdive"></div>
      <div class="si-panel" id="tab-aihub"><div id="content-aihub"></div></div>
    </div>

  </div>
</div>

<!-- KPI trend pop-up (ported from Schedule_App's trend modal) -->
